name: TypeScript prebuilt runtimes

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        type: string
        default: ''

permissions:
  contents: read

jobs:
  runtime:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            platform: linux-x64
            feature: llama
            devices: cpu
          - runner: ubuntu-22.04-arm
            platform: linux-arm64
            feature: llama
            devices: cpu
          - runner: macos-15-intel
            platform: darwin-x64
            feature: llama
            devices: cpu
          - runner: macos-14
            platform: darwin-arm64
            feature: llama-metal
            devices: cpu,metal
          - runner: windows-latest
            platform: win32-x64
            feature: llama
            devices: cpu
    runs-on: ${{ matrix.runner }}
    env:
      L2S1_PORTABLE_BUILD: '1'
      CCACHE_DISABLE: '1'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: typescript/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - run: 'cargo test --locked --lib http::'
      - run: cargo build --release --locked --features '${{ matrix.feature }}' --bin l2s1 --message-format=json-render-diagnostics > native-build.jsonl
      - run: node typescript/scripts/bundle-runtime.mjs --cargo-log native-build.jsonl --devices '${{ matrix.devices }}'
      - run: node typescript/scripts/verify-runtime.mjs 'typescript/runtime-packages/${{ matrix.platform }}'
      - run: npm pack --pack-destination ../../ --ignore-scripts
        working-directory: typescript/runtime-packages/${{ matrix.platform }}
      - run: npm ci && npm run build && npm run check && npm test && npm run test:rust && npm pack
        working-directory: typescript
      - run: |
          version=$(node -p "JSON.parse(require('node:fs').readFileSync('package.json', 'utf8')).version")
          npm run test:package -- "l2s1-node-$version.tgz" "l2s1-runtime-${{ matrix.platform }}-$version.tgz"
        working-directory: typescript
      - uses: actions/upload-artifact@v6
        with:
          name: l2s1-runtime-${{ matrix.platform }}
          path: typescript/l2s1-runtime-*.tgz
          if-no-files-found: error
      - uses: actions/upload-artifact@v6
        if: matrix.platform == 'linux-x64'
        with:
          name: l2s1-node
          path: typescript/l2s1-node-*.tgz
          if-no-files-found: error
