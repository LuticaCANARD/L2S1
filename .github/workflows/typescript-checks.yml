name: TypeScript library checks

on:
  pull_request:
    paths:
      - "sdks/typescript/**"
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "examples/typescript_fixture.rs"
      - ".github/workflows/typescript-checks.yml"
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  typescript:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['24']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: sdks/typescript/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
        working-directory: sdks/typescript
      - run: npm run build && npm run check && npm test && npm run test:rust && npm pack --dry-run
        working-directory: sdks/typescript
