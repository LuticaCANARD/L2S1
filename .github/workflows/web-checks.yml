name: Web checks

on:
  pull_request:
    paths:
      - 'web/**'
      - 'README*.md'
      - 'docs/**'
      - 'benchmarks/**/*.md'
      - '.github/workflows/web-checks.yml'
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'README*.md'
      - 'docs/**'
      - 'benchmarks/**/*.md'
      - '.github/workflows/web-checks.yml'

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run check
      - run: npm run build
