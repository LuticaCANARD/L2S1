name: Python SDK checks

on:
  pull_request:
    paths:
      - "sdks/typescript/**"
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "examples/typescript_fixture.rs"
      - ".github/workflows/python-checks.yml"
      - "sdks/python/**"
      - "scripts/*release*.py"
      - "scripts/publish_packages.py"
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        type: string
        default: ''

permissions:
  contents: read

jobs:
  python:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: dtolnay/rust-toolchain@stable
      - run: python -m pip install "./sdks/python[dev]"
      - run: python -m mypy --config-file sdks/python/pyproject.toml sdks/python/src sdks/python/examples sdks/python/tests/typecheck.py
      - run: cargo build --locked --example typescript_fixture
      - run: npm ci && npm run build
        working-directory: sdks/typescript
      - name: Test Python and TypeScript against the same resident Rust fixture
        shell: bash
        run: |
          suffix=""
          if [ "$RUNNER_OS" = "Windows" ]; then suffix=".exe"; fi
          L2S1_TEST_BINARY="$PWD/target/debug/examples/typescript_fixture$suffix" python -m unittest discover -s sdks/python/tests -v
      - run: python -m build sdks/python
      - name: Verify installed wheel imports outside the checkout
        shell: bash
        run: |
          python -m pip install --force-reinstall --no-deps sdks/python/dist/*.whl
          cd "$RUNNER_TEMP"
          python -c 'import l2s1; from importlib.resources import files; assert files("l2s1").joinpath("py.typed").is_file(); print(l2s1.__version__)'
      - uses: actions/upload-artifact@v6
        with:
          name: python-sdk-${{ matrix.os }}-${{ matrix.python }}
          path: sdks/python/dist/*

  release-configuration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - run: python -m unittest discover -s scripts -p 'test_release_pipeline.py' -v
