[package]
name = "flarellm-gpu"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "L2S1's compatibility-patched FlareLLM wgpu backend"

[lib]
name = "flare_gpu"

[dependencies]
flare-core = { package = "flarellm-core", git = "https://github.com/sauravpanda/flarellm", rev = "a8cb07cf54fa43c4e41664316498ed195fa7b018" }
wgpu = "24"
thiserror = "2"
log = "0.4"
byteorder = "1"
bytemuck = { version = "1", features = ["derive"] }
half = { version = "2", features = ["bytemuck"] }
pollster = "0.4"
futures-channel = "0.3"

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3", features = ["console"] }
wasm-bindgen-futures = "0.4"
