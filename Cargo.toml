[package]
name = "l2s1"
version = "0.1.0"
edition = "2024"
description = "Typed decisions from local GGUF chat model logits"
license = "MIT"
repository = "https://github.com/LuticaCANARD/L2S1"
exclude = ["/models/**", "**/*.gguf", "**/*.safetensors", "/target/**", "/results/**", "/web/**", "/crates/**", "/scripts/**"]
build = "build.rs"
links = "l2s1"

[workspace]
members = [".", "crates/l2s1-llama-sys", "crates/l2s1-tools"]
resolver = "3"

[features]
default = []
llama = ["dep:l2s1-llama-sys"]
llama-cuda = ["llama", "l2s1-llama-sys/cuda"]
llama-metal = ["llama", "l2s1-llama-sys/metal"]
openrouter = ["dep:reqwest"]
wgpu = ["dep:rullama-engine", "dep:wgpu", "dep:pollster", "dep:async-trait", "dep:image", "dep:half"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
thiserror = "2"
clap = { version = "4", features = ["derive"] }
sha2 = "0.10"
base64 = "0.22"
l2s1-llama-sys = { path = "crates/l2s1-llama-sys", version = "0.1.0", optional = true }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"], optional = true }
rullama-engine = { git = "https://github.com/Brainwires/rullama-framework", rev = "aef22b62f8a7a398ad5e5bc47b08c932f34f3c92", optional = true }
wgpu = { version = "29.0.3", optional = true }
pollster = { version = "0.4", optional = true }
async-trait = { version = "0.1", optional = true }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"], optional = true }
half = { version = "2", optional = true }

[build-dependencies]
sha2 = "0.10"

[[bin]]
name = "l2s1"
path = "src/main.rs"
required-features = ["llama"]

[[bin]]
name = "l2s1-wgpu"
path = "src/bin/l2s1-wgpu.rs"
required-features = ["wgpu"]

[[bin]]
name = "l2s1-openrouter"
path = "src/bin/l2s1-openrouter.rs"
required-features = ["openrouter"]
